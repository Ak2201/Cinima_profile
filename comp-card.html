<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comp Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    @page { size: A4 landscape; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #2a2620; font: 400 12px/1.5 Inter, system-ui, sans-serif; color: #1a1612; }
    .bar { display: flex; gap: 10px; justify-content: center; padding: 16px; }
    .bar button { font: 600 14px Inter, sans-serif; padding: 10px 20px; border-radius: 999px; border: 0; background: #d4a54a; color: #1a1408; cursor: pointer; }
    .bar a { color: #e9e2d4; align-self: center; font-size: 14px; }
    .card { width: 297mm; height: 210mm; margin: 0 auto 32px; background: #f7f3ec; display: grid; grid-template-columns: 112mm 1fr; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .hero { position: relative; }
    .hero img { width: 100%; height: 100%; object-fit: cover; }
    .side { padding: 14mm 14mm 12mm; display: grid; grid-template-rows: auto auto 1fr auto; gap: 7mm; }
    h1 { font: 300 46px/0.95 Fraunces, Georgia, serif; letter-spacing: -.02em; margin: 0; }
    h1 em { display: block; font-style: italic; font-weight: 500; color: var(--accent, #b68a35); }
    .roles { text-transform: uppercase; letter-spacing: .2em; font-size: 10px; color: #6d655a; margin-top: 4mm; }
    dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin: 0; border-top: 1px solid #d9d1c4; }
    dl div { padding: 2.6mm 3mm 2.6mm 0; border-bottom: 1px solid #e6dfd3; }
    dt { text-transform: uppercase; letter-spacing: .12em; font-size: 8.5px; color: #8a8275; }
    dd { margin: 0; font-weight: 600; font-size: 12px; }
    dd small { font-weight: 400; color: #8a8275; margin-left: 4px; }
    .pics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; min-height: 0; }
    .pics img { width: 100%; height: 100%; object-fit: cover; min-height: 0; }
    .foot { display: flex; justify-content: space-between; align-items: end; font-size: 11px; border-top: 2px solid #1a1612; padding-top: 3mm; gap: 8mm; }
    .foot b { display: block; font-size: 8.5px; text-transform: uppercase; letter-spacing: .14em; color: #8a8275; font-weight: 500; }
    @media print { body { background: none; } .bar { display: none; } .card { margin: 0; box-shadow: none; } }
    @media screen and (max-width: 1150px) { .card { zoom: .5; } }
  </style>
</head>
<body>
  <div class="bar"><button type="button" onclick="print()">Save as PDF / Print</button><a href="index.html">← Back to portfolio</a></div>
  <article class="card" id="card"></article>
  <script src="data/content.js"></script>
  <script src="js/store.js"></script>
  <script>
    Store.loadPublished().then((pub) => {
    const C = new URLSearchParams(location.search).has("preview") ? Store.draft(pub) : pub;
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    const p = C.profile, c = C.contact;
    document.documentElement.style.setProperty("--accent", C.site.accent);
    document.title = `${p.firstName} ${p.lastName} — Comp Card`;
    const age = p.birthYear ? new Date().getFullYear() - Number(p.birthYear) : "";
    const sheet = [...C.statSheet];
    if (age) sheet.splice(3, 0, { label: "Age", value: String(age), note: p.playingRange ? `plays ${p.playingRange}` : "" });
    const pics = [...C.gallery.filter((g) => g.src && g.src !== p.headshot).map((g) => g.src), ...C.bts.photos.map((b) => b.src)].slice(0, 3);
    document.getElementById("card").innerHTML = `
      <div class="hero"><img src="${esc(p.headshot)}" alt=""></div>
      <div class="side">
        <div><h1>${esc(p.firstName)}<em>${esc(p.lastName)}</em></h1><div class="roles">${p.roles.map(esc).join(" · ")}</div></div>
        <dl>${sheet.slice(0, 9).map((s) => `<div><dt>${esc(s.label)}</dt><dd>${esc(s.value)}${s.note ? `<small>${esc(s.note)}</small>` : ""}</dd></div>`).join("")}</dl>
        <div class="pics">${pics.map((s) => `<img src="${esc(s)}" alt="">`).join("")}</div>
        <div class="foot">
          <div><b>Email</b>${esc(c.email)}</div><div><b>Phone</b>${esc(c.phone)}</div><div><b>Instagram</b>@${esc(c.instagram)}</div>
          <div><b>Notable</b>${esc(C.featured.title)} — ${esc((C.featured.stats[0] || {}).value)} views</div>
        </div>
      </div>`;
    });
  </script>
</body>
</html>
