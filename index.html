<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArunKumar Mohanan — Actor · Director · Anchor</title>
  <meta name="description" content="">
  <meta property="og:type" content="website">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0b0907">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/img/hero.webp" fetchpriority="high">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="sr-only" href="#main">Skip to content</a>
  <header class="top" id="top">
    <a class="mark" href="#" aria-label="Back to top" data-bind="monogram">AM</a>
    <nav class="lens" aria-label="View portfolio as">
      <span class="lens-label mono">Viewing as</span>
      <!-- buttons rendered from content.lenses -->
    </nav>
    <a class="btn btn-gold btn-sm" href="#contact" data-bind="cta">Get in touch</a>
  </header>

  <section class="hero" aria-label="Introduction">
    <div class="hero-bg"><img alt="" data-bind="heroImage" fetchpriority="high"></div>
    <div class="wrap hero-inner">
      <div class="slate mono"><span>SC. 00 — TAKE 01</span><span>Chennai, IN</span><span>LV Prasad Film Institute</span></div>
      <h1><span data-bind="firstName"></span><em data-bind="lastName"></em></h1>
      <ul class="roles" data-bind="roles"></ul>
      <p class="hero-line" data-bind="heroLine"></p>
      <div class="hero-actions">
        <button class="btn btn-gold" type="button" data-action="reel">▶&nbsp; <span data-bind="reelLabel">Watch the reel</span></button>
        <a class="btn" href="#contact" data-bind="cta2">Get in touch</a>
        <span class="status" data-bind="status"><i></i><span></span></span>
      </div>
    </div>
    <div class="timecode mono" aria-hidden="true">00:00:00:00</div>
  </section>

  <main id="main"></main>

  <footer>
    <div class="wrap">
      <span data-bind="copyright"></span>
      <span><a href="comp-card.html">Comp card</a> · <a href="admin.html">Admin</a></span>
    </div>
  </footer>

  <dialog class="modal" id="modal" aria-label="Media viewer">
    <div class="modal-body"></div>
  </dialog>

  <script src="data/content.js"></script>
  <script src="js/store.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
